name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-product-claim
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            itaeris/product_claim_app:latest
            itaeris/product_claim_app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Kirim environment
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          printf '%s\n' "$BACKEND_ENV" > backend.env
          chmod 600 backend.env
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            backend.env "$SERVER_USER@$SERVER_HOST:product_claim_app.env"

      - name: Stop, hapus, pull, dan jalankan ulang
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          umask 077
          printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME" > dockerhub.env
          printf 'DOCKERHUB_TOKEN=%s\n' "$DOCKERHUB_TOKEN" >> dockerhub.env
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            dockerhub.env "$SERVER_USER@$SERVER_HOST:.product_claim_dockerhub.env"
          rm -f dockerhub.env
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" bash -s < .github/scripts/deploy.sh
